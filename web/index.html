<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panier Box | Payment</title>
<link rel="stylesheet" href="/styles.css">
<!-- Flow only ever loads from Checkout.com's own origin. Never downloaded,
     bundled or self-hosted: that's what keeps Panier Box on SAQ A. -->
<script src="https://checkout-web-components.checkout.com/index.js"></script>
<script type="module" src="/checkout.js"></script>
</head>
<body>

<div class="demo" role="region" aria-label="Demo controls">
  <strong>DEMO</strong>
  <label>Basket <select id="demo-basket">
    <option value="subscription">Subscription, first box</option>
    <option value="oneoff">One-off seasonal box</option>
  </select></label>
  <label>Country <select id="demo-country">
    <option value="FR">FR</option>
    <option value="PT">PT</option>
  </select></label>
</div>

<header>
  <div class="wrap">
    <a class="logo" href="/" aria-label="Panier Box home">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 18h28l-3.5 15a3 3 0 0 1-2.9 2.3H12.4A3 3 0 0 1 9.5 33z" fill="#E07A2E"/>
        <path d="M13 18c0-5 3-9 7-9s7 4 7 9" fill="none" stroke="#1E5B36" stroke-width="3" stroke-linecap="round"/>
        <path d="M20 9c1-4 4-6 8-6-1 4-4 6-8 6z" fill="#1E5B36"/>
        <path d="M14 24v6M20 24v6M26 24v6" stroke="#FAF7F0" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>PANIER<br>BOX</span>
    </a>
    <ol class="steps" aria-label="Checkout steps">
      <li>Box</li>
      <li>Delivery</li>
      <li aria-current="step">Payment</li>
    </ol>
  </div>
</header>

<div class="wrap page-head"><h1>Payment</h1></div>

<main class="wrap">
  <div class="col">
    <div class="banner error" id="error-banner" role="alert" hidden>
      <p id="error-text"></p>
    </div>

    <div class="banner">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="none" stroke="#1E5B36" stroke-width="2"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#1E5B36" stroke-width="2" stroke-linecap="round"/></svg>
      <p id="reserve-text"></p>
    </div>

    <section class="panel" aria-label="Delivery">
      <div class="panel-head">Delivery</div>
      <div class="panel-body">
        <p id="customer-name"></p>
        <p class="muted" id="customer-address"></p>
        <p class="muted" id="customer-email"></p>
      </div>
    </section>

    <!-- Recurring terms, subscription only. Also dispute evidence (UC-15). -->
    <div class="terms" id="terms" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="#1E1E1C" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#1E1E1C" stroke-width="2" stroke-linecap="round"/></svg>
      <p id="terms-text"></p>
    </div>

    <!-- Flow mounts here. Card details never touch this page's code. -->
    <div id="flow-container"></div>

    <p class="legal">By paying you agree to the Panier Box <a href="#">terms</a> and <a href="#">privacy policy</a><span id="legal-weekly"></span></p>
  </div>

  <aside class="summary" aria-label="Order summary">
    <div class="summary-top"><h2>Your order</h2></div>
    <ul class="lines" id="lines"></ul>
    <hr>
    <div class="total"><span>Total today</span><span id="total"></span></div>
    <p class="next" id="summary-next" hidden></p>
  </aside>
</main>

<footer>Panier Box is a made-up brand for a Checkout.com demo.</footer>

</body>
</html>
